name: Foundry Contracts

# Runs the full Foundry test suite (unit, fuzz, invariant, security, gas) for
# the EVM HTLCEscrow contract on every push to main and every PR that touches
# the contracts, mocks, interfaces, or foundry configuration.
#
# Invariant campaign: 1 024 sequences × 50 depth = up to 51 200 calls per invariant.
# Fuzz runs:          1 024 per fuzz test.
# All tests must pass before a PR can be merged.

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - ".github/workflows/foundry-contracts.yml"
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/foundry-contracts.yml"

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: foundry-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundry:
    name: Forge test (HTLCEscrow invariant + fuzz)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Install npm dependencies (OpenZeppelin, forge-std)
        run: pnpm install --frozen-lockfile

      - name: Compile contracts
        run: forge build --sizes

      - name: Run unit + fuzz tests
        run: forge test --match-path "test/foundry/HTLCEscrow.t.sol" -v --color
        env:
          FOUNDRY_FUZZ_RUNS: 1024

      - name: Run invariant tests (stateful fuzz campaign)
        run: forge test --match-contract "InvariantHTLCEscrowTest" -v --color
        env:
          FOUNDRY_INVARIANT_RUNS: 1024
          FOUNDRY_INVARIANT_DEPTH: 50

      - name: Run security tests
        run: forge test --match-contract "HTLCEscrowSecurityTest" -v --color

      - name: Run gas profiling benchmarks
        run: forge test --match-contract "InvariantHTLCEscrowTest" --match-test "testGas" -v --color

      - name: Show gas snapshot
        run: forge snapshot --match-contract "InvariantHTLCEscrowTest" --match-test "testGas" || true

      # On any test failure, print the failing sequence and invariant details.
      - name: Print failure details on error
        if: failure()
        run: |
          echo "::group::Foundry failure details"
          forge test -vvvv --match-contract "InvariantHTLCEscrowTest" 2>&1 | tail -200 || true
          echo "::endgroup::"

  # ── Slither static analysis ─────────────────────────────────────────────────
  # Runs Slither against first-party contracts only (vendored libraries and
  # forge-std are excluded via .slither.config.json filter_paths).
  #
  # Gate: new HIGH-confidence findings fail the step.  Any finding that has
  # been reviewed and accepted can be suppressed by adding an entry to
  # contracts/.slither-baseline.json with an owner and rationale.
  slither:
    name: Slither static analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Slither
        run: pip install slither-analyzer==0.10.4

      - name: Install solc 0.8.24
        run: pip install solc-select && solc-select install 0.8.24 && solc-select use 0.8.24

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Install npm dependencies (OpenZeppelin remappings)
        run: pnpm install --frozen-lockfile

      - name: Run Slither (scoped to first-party contracts)
        run: pnpm run analyze:ci

      - name: Upload Slither report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slither-report
          path: contracts/slither-report.json
          if-no-files-found: ignore

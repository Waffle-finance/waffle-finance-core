name: Repository Validation

# Runs the full pnpm validate suite on every push to main and every pull
# request.  The suite covers the repository's dependency-free quality gates:
#
#   validate:manifests — workspace package-manifest contracts
#   validate:deps      — cross-package dependency version alignment
#   validate:docs      — relative link resolution and pnpm script references
#   validate:env       — environment-variable coverage against example files
#   validate:metrics   — coordinator metric names vs. dashboards, alerts, docs
#   validate:deployments — chain-specific deployment address consistency
#
# The validators are dependency-free Node scripts wherever possible, so no
# pnpm install step is needed — this job stays fast and cannot be broken
# by a registry outage.  Any validator that requires installed dependencies
# is invoked through `pnpm validate` and will install as needed.
#
# See docs/QUALITY_GATE.md for the full check inventory.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate repository contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      # The validate suite is composed of dependency-free Node scripts
      # (manifests, deps, docs, env coverage, metric consistency, and
      # deployment address consistency) — no pnpm install is needed.
      - name: Validate repository contracts
        run: pnpm validate